name: hermes-cloudflare
version: 1.0.0
description: "Cloudflare Browser Run API - crawl, scrape, extract markdown/JSON/links/screenshots/PDFs from web pages, plus Workers AI chat and DNS-over-HTTPS lookups"
author: raulvidis
requires_env:
  - CLOUDFLARE_API_TOKEN
  - CLOUDFLARE_ACCOUNT_ID
provides_tools:
  - cf_crawl
  - cf_scrape
  - cf_markdown
  - cf_json_extract
  - cf_links
  - cf_content
  - cf_screenshot
  - cf_pdf
  - cf_snapshot
  - cf_accessibility_tree
  - cf_ai_chat
  - cf_dns
